# CI per ADR-002. Checks only: this workflow NEVER deploys (Netlify Git integration deploys, with user approval).
# No secrets are needed: tests use the in-memory/local emulator database, never a deployed one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, lint, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high
      - run: npm run build

  e2e:
    name: E2E (Playwright + astro dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer starts `astro dev --ignore-lock` (foreground) and stops it afterwards.
      # Migrations and the small-fixture seed are applied by tests/e2e/global-setup (Quinn) once those exist.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
