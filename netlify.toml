# Netlify build and header configuration (ADR-002). One site, repo root as base.
# No secrets here: set variables in the Netlify UI. NETLIFY_DB_URL is injected by Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.5"   # keep equal to .nvmrc
  NPM_FLAGS = "--no-audit --no-fund"

# Demo reset is OFF unless a context explicitly enables it (set the real value in the Netlify UI).
[context.production.environment]
  DEMO_RESET_ENABLED = "false"
[context.deploy-preview.environment]
  DEMO_RESET_ENABLED = "false"
[context.branch-deploy.environment]
  DEMO_RESET_ENABLED = "false"

# Security headers (DRAFT, ADR-002 section 9). Netlify applies [[headers]] to static/CDN responses;
# responses generated by the SSR function must ALSO get these from src/middleware.ts [A].
# Chart.js is bundled from npm and Astro is configured not to inline scripts, so script-src is 'self' only.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"

# Hashed build assets are immutable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
